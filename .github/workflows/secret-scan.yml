name: secret-scan

# The first CI this repo has ever had. It is deliberately NARROW: it runs the
# two suites that cover the secret guard, and nothing else.
#
# The ~18 other verify-*.sh suites at repo root are NOT wired up here on
# purpose. They have only ever been run by hand on a Mac, several need tmux,
# sqlite3, bun or a live herdr, and none has ever been green on ubuntu-latest.
# Opting the whole repo into a gate that fails on 18 pre-existing suites gets
# CI switched off in a week. Adding them is a separate job, one suite at a
# time, each proven green before it becomes required.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both suites build real repositories and make real commits. The scanner
      # refuses any commit not authored as tnt@teamthurber.com, so a runner with
      # no identity at all would fail every case for the wrong reason; the
      # fixtures set it per-repo, and this is the backstop for anything that
      # does not.
      - name: Identify the runner
        run: |
          git config --global user.email "tnt@teamthurber.com"
          git config --global user.name  "tntpgh"
          git config --global init.defaultBranch main
          git --version

      - name: Syntax-check the guard and its tooling
        run: |
          bash -n git-hooks/secret-scan-pre-commit.sh
          bash -n install-git-hooks.sh
          bash -n verify-secret-scan.sh
          bash -n verify-git-hook-install.sh

      # The scanner is invoked as `exec bash <path>` by every installed hook, so
      # a non-executable tracked copy still works — but a developer running it
      # directly should not have to know that.
      - name: The tracked scanner is executable
        run: test -x git-hooks/secret-scan-pre-commit.sh

      - name: Scanner behaviour (rename bypass, merges, allowlist, non-UTF8)
        run: bash verify-secret-scan.sh

      - name: Installer behaviour (leaves foreign hooks alone, undo restores)
        run: bash verify-git-hook-install.sh
