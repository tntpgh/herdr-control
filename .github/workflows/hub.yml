name: hub
# hub.py's own test suite (verify-hub.py), including OwnersView
# (SPEC.md feat/hub-owners-view). Offline, fixture-only: every fixture DB
# lives under a tempfile.mkdtemp() in this job's own checkout, no network,
# no secrets. Nothing before this ran it in CI at all.
on:
  pull_request:
    paths: ["hub.py", "verify-hub.py", "lib/owner_lease.py", "lib/owner_dispatch_auth.py", ".github/workflows/hub.yml"]
  push:
    branches: [main]
    paths: ["hub.py", "verify-hub.py", "lib/owner_lease.py", "lib/owner_dispatch_auth.py", ".github/workflows/hub.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 verify-hub.py
