name: offline-mcp-profile
# Runs verify-offline-mcp-profile.sh: isolated, stub-bounded spawn-task.sh --dry-run
# composition checks. It never executes spawn-agent.sh or a real launcher.
# Also runs verify-launcher-profile-identity.sh (default mode, CI-safe: a
# stub launcher + an isolated copy of this checkout, same technique as
# verify-offline-mcp-profile.sh's own $ctl fixture above -- never the real
# installed HERDR_OMP_BIN, which does not exist on ubuntu-latest) -- an
# earlier version of that script SKIPped unconditionally whenever the real
# binary was absent, so CI never exercised it at all (independent review,
# PR #400). --live (a real spawn, requires the real installed launcher) is
# intentionally never run here. Also runs verify-close-done-workers.sh,
# which close-done-workers.sh's own pane-close-failure reporting (same PR)
# is pinned against.
# No install step: bash, git, jq, sqlite3, python3 and shasum ship on ubuntu-latest.
on:
  pull_request:
    paths: ["verify-offline-mcp-profile.sh", "verify-launcher-profile-identity.sh", "verify-close-done-workers.sh",
            "verify-conductor-exit.sh", "verify-factory-cleanup.sh", "factory-cleanup.sh", "conductor-exit.sh",
            "spawn-task.sh", "spawn-agent.sh", "close-done-workers.sh", "ensure-workspace.sh", "config.sh",
            "lib/**", "agent-hooks/omp-worker-overlay.yml", "agent-hooks/omp-herdr-control.ts", "herdr-select.sh",
            "tests/fixtures/launcher-argv-guard.v26d.sh", "launchd/resolve-hub-python.sh", "tests/bounded-run.py", ".github/workflows/offline-mcp-profile.yml"]
  push:
    branches: [main]
    paths: ["verify-offline-mcp-profile.sh", "verify-launcher-profile-identity.sh", "verify-close-done-workers.sh",
            "verify-conductor-exit.sh", "verify-factory-cleanup.sh", "factory-cleanup.sh", "conductor-exit.sh",
            "spawn-task.sh", "spawn-agent.sh", "close-done-workers.sh", "ensure-workspace.sh", "config.sh",
            "lib/**", "agent-hooks/omp-worker-overlay.yml", "agent-hooks/omp-herdr-control.ts", "herdr-select.sh",
            "tests/fixtures/launcher-argv-guard.v26d.sh", "launchd/resolve-hub-python.sh", "tests/bounded-run.py", ".github/workflows/offline-mcp-profile.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: required tools present (no install)
        env:
          HERDR_HUB_PYTHON_DIRS: /usr/bin
        run: |
          for t in bash git jq sqlite3 python3 shasum mktemp; do command -v "$t" || { echo "missing $t"; exit 1; }; done
          py="$(bash launchd/resolve-hub-python.sh </dev/null)" && [ -x "$py" ] \
            || { echo "canonical resolver found no python3.11+ under /usr/bin"; exit 1; }
          echo "run-registry python: $py"
      - run: bash verify-offline-mcp-profile.sh
        env:
          OFFLINE_MCP_GUARD_SOURCE: fixture
          # run-registry pins python3.11+ from these dirs; the default is the Homebrew dirs, absent on Ubuntu
          HERDR_HUB_PYTHON_DIRS: /usr/bin
      - run: bash verify-launcher-profile-identity.sh
        env:
          HERDR_HUB_PYTHON_DIRS: /usr/bin
      - run: bash verify-close-done-workers.sh
        env:
          HERDR_HUB_PYTHON_DIRS: /usr/bin
      - run: bash verify-conductor-exit.sh
        env:
          HERDR_HUB_PYTHON_DIRS: /usr/bin
      - run: bash verify-factory-cleanup.sh
