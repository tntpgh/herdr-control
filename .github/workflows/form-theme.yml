name: form-theme
# OFFLINE contrast/dark-mode proof for lib/form_theme.py (force_dark), exercised
# against the real owner-dispatch-issue.py render_form() output and the hub's
# serve_stored_form() route. No network, no secrets, no live state.
on:
  pull_request:
    paths: ["lib/form_theme.py", "verify-form-theme.py", "hub.py", "formserve.py", "owner-dispatch-issue.py", ".github/workflows/form-theme.yml"]
  push:
    branches: [main]
    paths: ["lib/form_theme.py", "verify-form-theme.py", "hub.py", "formserve.py", "owner-dispatch-issue.py", ".github/workflows/form-theme.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 verify-form-theme.py
