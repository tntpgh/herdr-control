name: owner-lease
# INERT owner-lease contract (lib/owner_lease.py): nothing at runtime calls it.
# These offline checks keep its CAS/fencing/queue/reap/rollback/upgrade proofs green,
# plus the inert result-availability primitive (lib/result_availability.py).
on:
  pull_request:
    paths: ["lib/owner_lease.py", "lib/owner_lease_delivery.py", "lib/owner_lease_reap.py", "verify-owner-lease.py", "verify-owner-lease-reap-wiring.py", "owner-dispatch-issue.py", "verify-owner-lease-delivery.py", "remote-mcp/publisher.py", "lib/result_availability.py", "verify-result-availability.py", "lib/owner_dispatch.py", "lib/owner_dispatch_auth.py", "lib/private_sqlite.py", "owner-dispatch.py", "owner-lease-claim.py", "verify-owner-dispatch.py", "verify-owner-dispatch-standing.py", ".github/workflows/owner-lease.yml", "verify-deploy-launcher-compat.sh", "launchd/agent-lib.sh", "config.sh"]
  push:
    branches: [main]
    paths: ["lib/owner_lease.py", "lib/owner_lease_delivery.py", "lib/owner_lease_reap.py", "verify-owner-lease.py", "verify-owner-lease-reap-wiring.py", "owner-dispatch-issue.py", "verify-owner-lease-delivery.py", "remote-mcp/publisher.py", "lib/result_availability.py", "verify-result-availability.py", "lib/owner_dispatch.py", "lib/owner_dispatch_auth.py", "lib/private_sqlite.py", "owner-dispatch.py", "owner-lease-claim.py", "verify-owner-dispatch.py", "verify-owner-dispatch-standing.py", ".github/workflows/owner-lease.yml", "verify-deploy-launcher-compat.sh", "launchd/agent-lib.sh", "config.sh"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 verify-owner-lease.py
      - run: python3 verify-owner-lease-reap-wiring.py
      - run: python3 verify-owner-lease-delivery.py
      - run: python3 verify-result-availability.py
      - run: python3 verify-owner-dispatch.py
      - run: python3 verify-owner-dispatch-standing.py
      - run: bash verify-deploy-launcher-compat.sh
