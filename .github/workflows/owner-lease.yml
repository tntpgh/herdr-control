name: owner-lease
# INERT owner-lease contract (lib/owner_lease.py): nothing at runtime calls it.
# These offline checks keep its CAS/fencing/queue/reap/rollback proofs green.
on:
  pull_request:
    paths: ["lib/owner_lease.py", "verify-owner-lease.py", ".github/workflows/owner-lease.yml"]
  push:
    branches: [main]
    paths: ["lib/owner_lease.py", "verify-owner-lease.py", ".github/workflows/owner-lease.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 verify-owner-lease.py
