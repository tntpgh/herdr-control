# ============================================================================
#  herdr config additions for smart-name.sh + attention.sh
#
#  Merge these blocks into ~/.config/herdr/config.toml, then:
#      herdr server reload-config
#  Replace __HERDR_CONTROL__ with the absolute path to your checkout.
#
#  WARNING (learned from herdmates, verified on herdr 0.7.x): an INVALID token
#  name fails SILENTLY — reload-config reports "partial" and keeps the OLD
#  layout. If an edit "does nothing", run `herdr config check` and re-verify
#  every token name. Built-in agent-row tokens are exactly:
#      state_icon state_text workspace tab pane agent
#      terminal_title terminal_title_stripped
#  Anything with a `$` prefix is a custom token published via
#  `pane report-metadata --token`; absent tokens simply omit their row, so
#  these are always safe to configure.
# ============================================================================

# ---- Agent sidebar cards: show the task + honest status --------------------
# $task   <- smart-name.sh   (the tab's current task label)
# $status <- attention.sh    (permission / waiting reason / working)
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["$task"],
  ["$status"],
]

# Optional: give Claude leads a denser card than the default.
# [ui.sidebar.agents.rows_by_agent]
# claude = [["state_icon", "workspace", "tab"], ["$task"], ["$status"], ["agent"]]

# ---- Space sidebar rows (unchanged built-ins, here for reference) ----------
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

# ---- Keybindings -----------------------------------------------------------
# prefix+t  — smart-name the focused tab now (runs detached; the rename lands
#             a moment later). A model call for an agent tab takes a few seconds.
# (Scripts are invoked via `bash <path>` — this repo's scripts are not marked
#  executable, matching install.sh and the sort-tabs keybinding in README.)
[[keys.command]]
key = "prefix+t"
type = "shell"
command = "bash __HERDR_CONTROL__/smart-name.sh"

# prefix+alt+t — smart-name every tab (deterministic ones instantly, agent tabs
#                as their model calls return).
[[keys.command]]
key = "prefix+alt+t"
type = "shell"
command = "bash __HERDR_CONTROL__/smart-name.sh --all"

# prefix+a — "what needs me next": the focus view in a modal popup. The trailing
#            read holds the popup open until you press a key.
[[keys.command]]
key = "prefix+a"
type = "popup"
command = "bash __HERDR_CONTROL__/attention.sh --focus; printf '\\n[any key to close] '; read -rsn1"
width = "70%"
height = "60%"
